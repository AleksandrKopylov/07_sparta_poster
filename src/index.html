<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sparta museum poster</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="main">
        <section class="poster_redlabel">
            <div class="poster_labelname">new</div>
        </section>

        <article>
            <section class="poster_card">
                <img src="img/poster_of_leonidas.jpg" alt="poster_of_leonidas" class="poster_img">
            </section>

            <h1 class="poster_name">Leonidas art</h1>
            <h2 class="poster_museumexhibition">Museum exhibition</h2>
        </article>
        <section class="poster_date">
            <div class="poster_datetext">480-470 BC</div>
        </section>
    </main>
</body>
</html>
